name: build-verify

# 用途：在 GitHub 上验证「源码能编译、单测能过、原生库锁定成立」。
# 手动触发（workflow_dispatch）时额外构建一个可安装的 debug APK。
# 不产出正式签名包（签名密钥不在仓库里），也不跑设备验收。
on:
  workflow_dispatch:
  push:
    branches: ["build/**", "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin the Linux-only aapt2 verification entry
        # 仓库里的 verification-metadata.xml 在 Windows 生成，只 pin 了 aapt2-windows.jar；
        # Linux 上 AGP 解析 aapt2-9.1.1-14792394-linux.jar 会因缺校验条目直接失败。
        # 只补公开来源的确切条目，其余仍保持严格校验。
        run: python3 ci/patch-verification-metadata.py gradle/verification-metadata.xml

      - name: bxroot native closure is byte-exact
        run: |
          python3 -B tools/bxroot/build.py --check
          python3 -B tools/prepare-bxroot-native-proof.py --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Android SDK 37 + build-tools 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Compile + unit tests (standard debug)
        # 离线归档（offline-rootfs.bin / dsh-runtime.bin / ubuntu-tools.bin）不入仓，
        # 因此单测必须排除资产准备任务，与 ci-fast.yml 保持同一口径。
        run: |
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :app:testStandardDebugUnitTest \
            -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  apk:
    # 只在手动触发时出包：push 触发时只做验证，避免每次推送都白跑十几分钟。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin the Linux-only verification entries
        run: python3 ci/patch-verification-metadata.py gradle/verification-metadata.xml

      - name: bxroot native closure is byte-exact
        run: |
          python3 -B tools/bxroot/build.py --check
          python3 -B tools/prepare-bxroot-native-proof.py --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Android SDK 37 + build-tools 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$SDK/cmdline-tools/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Fetch official offline assets
        # offline-rootfs.bin / ubuntu-tools.bin 是构建产物且被 gitignore 排除。
        # runner 访问 GitHub 是内网级速度，直接拉官方 APK 原样取出两个 STORED 的 bin，
        # 并从字节反算 ubuntu-tools.inputs.json 需要的三项证书。
        run: |
          curl -L --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/official.apk" \
            "https://github.com/DSH-APP/DSHA/releases/download/v0.2.0-rc2/dsha-0.2.0-rc2.apk"
          python3 ci/extract-offline-assets.py --apk "$RUNNER_TEMP/official.apk" --assets app/src/main/assets

      - name: Build locked dsh runtime (0.2.1-rc.2)
        # 0.2.1 上游内部仍有对 0.2.0 的 peer 声明，而本项目是全显式 pin 的打包方式，
        # lock 也是用 --legacy-peer-deps 生成的，这里保持同一口径。
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: python3 -B tools/prepare-dsh-runtime.py

      - name: Assemble standard debug APK
        run: |
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleStandardDebug

      - name: Report APK identity
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk" || { echo "APK not found"; exit 1; }
          ls -lh "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsha-standard-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
            ${{ runner.temp }}/apk.sha256
          if-no-files-found: error
          retention-days: 14
