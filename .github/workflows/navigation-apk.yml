name: Navigation fix APK (dsh 0.2.1-rc.2)
run-name: Build dsh 0.2.1-rc.2 fix (${{ github.sha }})
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restore matching dsh 0.2.1-rc.2 runtime assets
        run: |
          curl -fL --retry 3 https://github.com/133563825as-ai/dsha-build/releases/download/v0.2.25-dsh0.2.1-rc2-test/dsha-0.2.25-dsh0.2.1-rc2-test.apk -o /tmp/official.apk
          curl -fL --retry 3 https://github.com/133563825as-ai/dsha-build/releases/download/v0.2.25-dsh0.2.1-rc2-test/dsha-0.2.25-dsh0.2.1-rc2-test.apk.sha256 -o /tmp/official.sha256
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          apk=pathlib.Path('/tmp/official.apk')
          expected=pathlib.Path('/tmp/official.sha256').read_text().split()[0]
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          with zipfile.ZipFile(apk) as z:
              for entry in z.infolist():
                  if entry.is_dir(): continue
                  if entry.filename.startswith('assets/'):
                      rel=pathlib.PurePosixPath(entry.filename).relative_to('assets')
                      if '..' in rel.parts: raise ValueError('unsafe asset path')
                      for base in ['app/build/generated/standardAssets']:
                          p=pathlib.Path(base).joinpath(*rel.parts);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(entry))
                      p=pathlib.Path('app/src/main/assets').joinpath(*rel.parts)
                      if not p.exists():p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(entry))
                  elif entry.filename.startswith('lib/arm64-v8a/'):
                      name=pathlib.PurePosixPath(entry.filename).name
                      dest=pathlib.Path('app/src/main/jniLibs/arm64-v8a')/name
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(entry))
          PY
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: |
          platform=$(python3 tools/ci-toolchain.py --field androidPlatform)
          buildtools=$(python3 tools/ci-toolchain.py --field buildTools)
          ndk=$(python3 tools/ci-toolchain.py --field ndk)
          sdkmanager "platforms;$platform" "build-tools;$buildtools" "ndk;$ndk"
      - name: Restore stable fork debug signing key
        env:
          DSHA_WORKSPACE_DEBUG_KEYSTORE_B64: ${{ secrets.DSHA_WORKSPACE_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          raw=os.environ.get('DSHA_WORKSPACE_DEBUG_KEYSTORE_B64','')
          if not raw:raise SystemExit('Missing stable workspace signing secret; refusing random debug key')
          p=pathlib.Path.home()/'.android/debug.keystore'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_bytes(base64.b64decode(raw,validate=True));p.chmod(0o600)
          PY
      - name: Compile debug APK with navigation bar fix (dsh 0.2.1-rc.2)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug -x :app:prepareStandardAssets -x :app:prepareRecoveryAssets -x :app:prepareBackupAssets -x :app:prepareRuntimeDescriptor -x :app:verifyBxrootNative -x :app:verifyBxrootProjection --no-daemon --max-workers=2
          bt=$(python3 tools/ci-toolchain.py --field buildTools)
          mkdir -p dist
          cp app/build/outputs/apk/standard/debug/*.apk dist/DSHA-fix4-navfix-0.2.1-rc2-debug.apk
          "$ANDROID_HOME/build-tools/$bt/apksigner" verify --verbose dist/*.apk
          "$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs dist/*.apk > dist/SIGNING-CERTIFICATE.txt
          printf '%s\n' '${{ github.sha }}' > dist/SOURCE-COMMIT.txt
          sha256sum dist/*.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DSHA-fix4-navfix-0.2.1-rc2-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
